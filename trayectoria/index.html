<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trayectoria profesional</title>
  <meta name="description" content="Recorrido laboral, formación y competencias profesionales.">
  <link rel="icon" type="image/x-icon" href="../assets/darkness.ico">
  <link rel="stylesheet" href="../style.css?v=18">
  <link rel="stylesheet" href="trayectoria.css?v=6">
  <script>
    window.SITE_CONFIG = {
      context: 'trayectoria',
      site: { title: 'Trayectoria profesional', lang: 'es', theme: 'dark' },
      data_url: '../data/content.json',
      sections: [
        { id: 'inicio', label: 'Inicio', type: 'hero' },
        { id: 'sobre-mi', label: 'Sobre mí', type: 'about' },
        { id: 'trayectoria', label: 'Trayectoria', type: 'cv' },
        { id: 'competencias', label: 'Competencias', type: 'skills' },
        { id: 'certificaciones', label: 'Certificaciones', type: 'certifications' },
        { id: 'contacto', label: 'Contacto', type: 'contact' },
        { id: 'reclutador', label: 'Reclutador', type: 'recruiter' }
      ]
    };
  </script>
</head>
<body class="site-trayectoria">
  <div class="bg-layer bg-layer--route" aria-hidden="true"></div>
  <div class="bg-layer bg-layer--dots" aria-hidden="true"></div>
  <main id="app"></main>
  <footer class="site-footer">
    <a class="peer-link" href="../">← Perfil tecnológico</a>
    <p class="footer-text">© 2026 Jeyson. Todos los derechos reservados.</p>
    <p>Versión 0.10.0-beta.14</p>
    <p><a class="footer-admin" href="../admin/">༺༼༐౷෴಄༐༽༻</a></p>
  </footer>
  <script src="../supabase-config.js?v=2"></script>
  <script src="../script.js?v=27"></script>
  <script>
    (function () {
      function trayLinks() {
        var source = document.querySelector('.site-header .nav ul');
        if (!source) return null;
        return Array.prototype.slice.call(source.querySelectorAll('a')).filter(function (a) {
          return a.dataset.section !== 'inicio';
        });
      }

      function buildDesktopNav(sourceLinks, hero) {
        if (document.getElementById('tray-nav-tree')) return;
        var tree = document.createElement('nav');
        tree.className = 'nav-tree';
        tree.id = 'tray-nav-tree';
        tree.setAttribute('aria-label', 'Navegación');
        var list = document.createElement('ul');
        tree.appendChild(list);

        sourceLinks.forEach(function (orig) {
          var item = document.createElement('li');
          item.className = 'nav-tree-item';
          var link = document.createElement('a');
          link.href = orig.getAttribute('href');
          link.textContent = orig.textContent;
          if (orig.dataset.section) link.setAttribute('data-section', orig.dataset.section);
          item.appendChild(link);
          list.appendChild(item);
        });

        var actions = hero.querySelector('.hero-actions');
        if (actions) {
          actions.after(tree);
        } else {
          hero.appendChild(tree);
        }
      }

      function buildMobileNav(sourceLinks) {
        if (document.getElementById('tray-mobile-nav')) return;
        var bar = document.createElement('nav');
        bar.className = 'tray-mobile-nav';
        bar.id = 'tray-mobile-nav';
        bar.setAttribute('aria-label', 'Navegación móvil');
        sourceLinks.forEach(function (orig) {
          var link = document.createElement('a');
          link.href = orig.getAttribute('href');
          link.textContent = orig.textContent;
          if (orig.dataset.section) link.setAttribute('data-section', orig.dataset.section);
          bar.appendChild(link);
        });
        document.body.prepend(bar);
      }

      function wireActive() {
        if (!('IntersectionObserver' in window)) return;
        var groups = [];
        var tree = document.getElementById('tray-nav-tree');
        if (tree) groups.push(tree.querySelectorAll('a'));
        var bar = document.getElementById('tray-mobile-nav');
        if (bar) groups.push(bar.querySelectorAll('a'));

        if (window.__traySectionObserver) window.__traySectionObserver.disconnect();
        window.__traySectionObserver = new IntersectionObserver(
          function (entries) {
            entries.forEach(function (entry) {
              if (entry.isIntersecting) {
                groups.forEach(function (links) {
                  links.forEach(function (link) {
                    link.classList.toggle('active', link.dataset.section === entry.target.id);
                  });
                });
              }
            });
          },
          { rootMargin: '-40% 0px -55% 0px' }
        );
        document.querySelectorAll('#app section[id]').forEach(function (section) {
          window.__traySectionObserver.observe(section);
        });
      }

      function mayBuild() {
        var links = trayLinks();
        var hero = document.querySelector('#inicio .hero');
        if (!links || !hero) return;
        buildDesktopNav(links, hero);
        buildMobileNav(links);
        wireActive();
      }

      var watcher = new MutationObserver(mayBuild);
      watcher.observe(document.body, { childList: true, subtree: true });
      mayBuild();

      function onScroll() {
        var bar = document.getElementById('tray-mobile-nav');
        if (!bar) return;
        bar.classList.toggle('is-scrolled', window.scrollY > 48);
      }
      if (typeof requestAnimationFrame === 'function') {
        var ticking = false;
        window.addEventListener('scroll', function () {
          if (ticking) return;
          ticking = true;
          requestAnimationFrame(function () {
            onScroll();
            ticking = false;
          });
        }, { passive: true });
      } else {
        window.addEventListener('scroll', onScroll, { passive: true });
      }
    })();
  </script>
</body>
</html>
